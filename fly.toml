# Fly.io config for the trading bot: one always-on machine, SQLite on a volume.
# Change `app` to a unique name, and `primary_region` if you prefer (iad = US East,
# fra = Frankfurt; both are close to Jupiter and the main Solana RPCs).
app = "supermeme"
primary_region = "iad"

[build]

[env]
  TB_MODE = "paper"
  TB_DB_PATH = "/data/tradingbot.db"
  TB_HEALTH_PORT = "8080"
  TB_MODEL_BOOK_SLOW = "0"  # 24h model5 book off (10-28: -10%, 61% rugged)
  # All model5 books off (10-31: 10m -13%, climb -6%, ops9/ops10 -8%; rugs 16-30% of picks)
  TB_MODEL_BOOK_FAST = "0"
  TB_MODEL_BOOK_CLIMB = "0"
  TB_MODEL_BOOK_OPS = "0"
  TB_EARLY_BOOK = "1"  # early5/early6/early7: hand-made pools at first sight, out by pool minute 5/6/7 (10-31)
  TB_EARLY_ROLLING = "1"  # early5r/6r/7r: same, top 5% of the past day's eligible pools (rolling cut-off)
  TB_EARLY_TIGHT = "1"  # early6t: early6 at the top 2% of the training scores (11-03)
  TB_CLAUDE_TRADING = "0"  # no Opus buy/pass analysis, triage or learning: 0 Claude buys in two weeks
  TB_SHADOWS = ""  # filters_only/random baselines off: with Claude off they only cost GeckoTerminal/Jupiter calls
  TB_LAUNCH_LIVE = "1"  # second-4 launch scorer (11-02): gets the Helius credits below
  TB_MARKET_MONITOR = "1"  # hourly meme-market measures (11-07, market_monitor.py), read only
  TB_MARKET_MONITOR_SINCE = "1793847600"  # baseline from 11-05 03:00 UTC: earlier hours had the scorer capped by the Helius budget
  TB_LAUNCH_BOOK = "1"  # launch4_2 / launch4_5 paper books trade its top 2% / 5% picks
  TB_LAUNCH_HIST_BOOK = "0"  # launch4h_2/5 off (11-04): history model worse every exit minute (launch-exit-study)
  TB_LAUNCH_M5_BOOK = "1"  # launch4_2m5: launch4_2's picks sold at pool minute 5 (11-04)
  # REAL MONEY canary of launchrw50_sz: canary-stop to halt, canary-start to clear the kill switch (DEPLOY.md).
  TB_LAUNCH_CANARY = "0"  # REAL MONEY canary OFF until the wallet is funded; "1" = canary_rw50_sz at 1/25 of launchrw50_sz's sizes, every pick, every pool (user, 11-07; DEPLOY.md)
  TB_LAUNCH_CANARY_USD = "5"  # fallback size when a signal has no liquidity
  TB_LAUNCH_CANARY_MAX_LIQ_USD = "0"  # every pool, all three bands (user, 11-07)
  TB_LAUNCH_CANARY_FLAT_USD = "0"  # off: sizes follow the twin's bands (was 0.01, the 1-cent test)
  TB_LAUNCH_CANARY_BAND_SCALE = "0.04"  # 1/25 of the twin: $10 below $15k, $1 at $15-25k, $4 above (11-07)
  TB_LAUNCH_CANARY_BUDGET_USD = "600"  # the USDC in the canary wallet (11-07; was 45)
  TB_LAUNCH_CANARY_DAILY_LOSS_USD = "300"  # no new buys once today's net realized loss reaches $300 (11-07)
  TB_LAUNCH_CANARY_EVERY_N = "1"  # every pick (11-07; 2 = every other, which gives canary-rug-check a skipped control)
  TB_LAUNCH_CANARY_FOLLOW_DD = "1"  # no new buys while launchrw50_sz_dd24 is paused by its past-24h $500 limit (11-10)
  TB_LAUNCH_CANARY_MAX_OPEN = "20"  # ~30 picks/h held ~6 min: open slots should never cause a skip (was 5)
  TB_LAUNCH_RW_BOOK = "1"  # launchrw50 / launchd12rw50: skip the riskiest half by rug-vs-win odds (11-04)
  TB_LAUNCH_SIZED_BOOK = "1"  # launchrw50_sz: launchrw50's signals sized by liquidity band ($250 < $15k, $25 at $15-25k, $100 above), from size-study (11-06)
  TB_LAUNCH_SIZED_DD_BOOK = "1"  # launchrw50_sz_dd24: sz with no new buys while down $500+ over the past 24 h (dd-limits, 11-09)
  TB_LAUNCH_HOLD_BOOK = "1"  # launchrw50_25k10 / launchrw50_25k15: rug-vs-win kept $25-40k pools, $250, out at pool minute 10 / 15 (11-08 hold-study)
  TB_LAUNCH_BIG_BOOK = "1"  # launchbig40k: +50% model best 30% of $40-80k pools, $250, out at minute 6/10 unless up and rising, else 15 (11-08 band-prize)
  TB_LAUNCH_BIG_MID_BOOK = "1"  # launchbig15k: +50% model best 30% of $15-25k pools, $100, out at minute 6 (11-09)
  TB_LAUNCH_THIN_BOOK = "1"  # nine thin-band books: every pool / rw50 / band rule x $100 / $250 / 2% of pool (11-09)
  TB_LAUNCH_BAND_BOOK = "1"  # launchrwband / launchrwband_sz: rug-vs-win ranked within each liquidity band ($5-15k skip 20%, $15-25k skip 70%, $25-40k live rule), $100 / $250 in thin pools (11-08)
  TB_LAUNCH_RW24_BOOK = "1"  # launchrw50_24h / launchd12rw50_24h: the same filter on the earlier rule (24 h ranking, daily 14-day model), beside the study-rule books (11-05)
  TB_SHORTBOOK_FEED_URL = "http://shortbook-paper.internal:8080/api/feed"  # MZF Short Only on the dashboard (Fly private network, read-only)
  TB_LAUNCH_LOW_BOOK = "1"  # launchd12 + _s10/_s20/_s30/_s50: history-model bottom 20% minus the riskiest k% early pullers (11-04)
  TB_LAUNCH_DAILY_CREDITS = "10000000"  # uncapped (11-05: user, never let trades turn off; upgrade the Helius plan when it runs out)
  TB_LAUNCH_LIVE_DAILY_CREDITS = "10000000"  # scorer uncapped (11-05): the 28k/day pro-rata budget idled every book ~25 min of each UTC hour (0 would mean off)
  TB_DISABLED_BOOKS = "launchd12_s10,launchd12_s20,launchd12_s30,launchd12_s50,early7,early7r,launchd12,launchd12rw50,launchd12rw50_24h,early5,early6,early5r,early6r,early6t,launch4_2,launch4_5,launch4_2m5,launch4_5m5"  # 11-05: skip books + minute-7 exits; 11-08: the d12 family (launchd12 -83%, d12rw50 -33/-29%), every early book (-5..-16%, worse than their backtests) and the launch4 books (-9..-13%): all lose to the market at sz's sizes in most 6 h blocks (block-compare)
  TB_MODEL_BOOK_DAILY_LOSS_PCT = "0"  # 11-05: no daily loss limit on the paper books (launch4_5 skipped 68 signals on it): every signal is traded and measured
  TB_RESET_BOOKS = "canary_rw50_sz"  # canary restarts at $600 (11-07); once per id; earlier: 2026-11-06-canary-20 + 2026-11-06-canary-45 canary, 2026-11-02-drift launch4_2/5, 2026-11-04-impact-probe launchd12 books, 2026-11-05-dashboard-lag + 2026-11-05-study-rule launchrw50/launchd12rw50
  TB_RESET_BOOKS_ID = "2026-11-07-canary-600"
  TB_HELIUS_DAILY_CREDITS = "0"  # early-buyer lookups off: their credits go to the launch scorer
  TB_OPERATOR_DAILY_CREDITS = "0"  # rug-catcher operator lookups off (ops books are off)

# The journal. Daily snapshots are kept for 14 days; the volume grows itself if it fills.
[mounts]
  source = "tradingbot_data"
  destination = "/data"
  snapshot_retention = 14
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "2GB"
  auto_extend_size_limit = "30GB"

# The bot's watchdog exits the process if a loop stalls; this brings it straight back.
[[restart]]
  policy = "always"

# Public HTTPS for the live dashboard (password: Fly secret DASHBOARD_TOKEN; without it the
# dashboard routes return 404 and only /health answers). The machine is never stopped by Fly.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

# Private health check. See `fly checks list`.
[checks]
  [checks.alive]
    type = "http"
    port = 8080
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "2m"

[[vm]]
  size = "shared-cpu-2x"
  # 11-04: froze at 00:57 UTC on 2 GB (nightly report + retrain next to ten early/launch books, 19 days of data);
  # 1 shared CPU allows at most 2 GB, so 2 CPUs for 4 GB
  memory = "4096mb"
