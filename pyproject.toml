[project]
name = "tradingbot"
version = "0.1.0"
description = "Claude-driven Solana memecoin scanner and trader (paper-first)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
live = ["solders>=0.21"]
backup = ["boto3>=1.34"]
engineer = ["pytest>=8"]
dev = ["pytest>=8", "moto[s3]>=5"]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tradingbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
